<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="theme-toggle">🌙 Dark Mode</button>
   <div id="container">
    <div id="card1" class="card">
        <div class="flag"></div>
        <h2>Nigeria</h2>
        <div class="time" id="timeNigeria">00:00:00</div>
    </div>

    <div id="card2" class="card">
        <div class="flag"></div>
        <h2>United Kingdom</h2>
        <div class="time" id="timeUK">00:00:00</div>
    </div>

    <div id="card3" class="card">
        <div class="flag"></div>
        <h2>Malaysia</h2>
        <div class="time" id="timeMalaysia">00:00:00</div>
    </div>
   </div>

    <script src="script.js"></script>
</body>
</html>
